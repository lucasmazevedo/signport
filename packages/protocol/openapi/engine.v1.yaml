# SPDX-License-Identifier: Apache-2.0
openapi: 3.1.0
info:
  title: SignPort Engine internal API
  version: 1.0.0-draft.1
  summary: Private Hub-to-Engine API for PAdES preparation, completion and validation (ADR-0014).
  description: |
    Canonical contract (ADR-0014). Private network only; never exposed to browsers or the public internet.
    No aliases or legacy routes exist.

    Three values must never be confused (SPEC §5): `document_sha256` (hex, original PDF, audit),
    `byte_range_digest_b64` (messageDigest attribute) and `signed_attributes_digest_b64`
    (SHA-256 of DER signed attributes, the only value signed by the key).

    PENDING the P1 PoC: ICP-Brasil policy OIDs and attributes, CMS reservation size, timestamping.
    Mutating POSTs accept `Idempotency-Key`. Errors use the `HttpError` schema; no stack traces.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://engine.internal.invalid
    description: Placeholder for the private network address.
security:
  - serviceToken: []
  - mutualTLS: []
tags:
  - name: preparations
    description: PDF preparation and completion.
  - name: validations
    description: Signed PDF validation.
  - name: certificates
    description: Certificate inspection and validation.
  - name: metadata
    description: Policies and capabilities.
  - name: health
    description: Liveness and readiness.
paths:
  /v1/pdf/preparations:
    post:
      tags: [preparations]
      operationId: createPreparation
      summary: Prepare a PDF for external signing
      description: Reserves the CMS placeholder by incremental update, computes the ByteRange digest and builds the signed attributes. State is persisted in a versioned explicit format (no pickle) and survives restarts.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/v1/engine/api.schema.json#/$defs/CreatePreparationRequest'
      responses:
        '201':
          description: Preparation created.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/engine/api.schema.json#/$defs/Preparation'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/pdf/preparations/{preparation_id}:
    parameters:
      - $ref: '#/components/parameters/PreparationId'
    get:
      tags: [preparations]
      operationId: getPreparation
      summary: Get preparation state
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Preparation state.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/engine/api.schema.json#/$defs/Preparation'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [preparations]
      operationId: cancelPreparation
      summary: Cancel a preparation and schedule cleanup of temporary artifacts
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Cancelled (idempotent for an already cancelled preparation).
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/engine/api.schema.json#/$defs/CancelPreparationResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/pdf/preparations/{preparation_id}/complete:
    parameters:
      - $ref: '#/components/parameters/PreparationId'
    post:
      tags: [preparations]
      operationId: completePreparation
      summary: Verify the raw signature and embed the CMS
      description: Verifies the raw RSA signature against the bound certificate and the exact signed attributes, rebuilds the CMS without altering signed attributes and finalizes the PDF. Idempotent for the same attempt and signature. Never changes the ByteRange after signing; if the CMS exceeds the reservation, returns CMS_RESERVATION_EXCEEDED.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/v1/engine/api.schema.json#/$defs/CompletePreparationRequest'
      responses:
        '200':
          description: Completed; artifact stored immutably. Publication still requires validation.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/engine/api.schema.json#/$defs/CompletePreparationResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/pdf/validations:
    post:
      tags: [validations]
      operationId: createValidation
      summary: Validate a signed PDF
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/v1/engine/api.schema.json#/$defs/CreateValidationRequest'
      responses:
        '202':
          description: Validation accepted.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/engine/api.schema.json#/$defs/ValidationAccepted'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/pdf/validations/{validation_id}:
    parameters:
      - $ref: '#/components/parameters/ValidationId'
    get:
      tags: [validations]
      operationId: getValidation
      summary: Get a validation report
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Structured report with separate dimensions and a final decision.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/engine/api.schema.json#/$defs/ValidationReport'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/certificates/inspect:
    post:
      tags: [certificates]
      operationId: inspectCertificate
      summary: Parse a public certificate
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/v1/engine/api.schema.json#/$defs/InspectCertificateRequest'
      responses:
        '200':
          description: Certificate metadata. May contain sensitive personal data; never log.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/engine/api.schema.json#/$defs/CertificateInfo'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/certificates/validate:
    post:
      tags: [certificates]
      operationId: validateCertificate
      summary: Validate chain, validity period, revocation and key usage
      description: Trust anchors come only from the versioned trust bundle. OCSP/CRL/AIA fetching is egress-controlled (SSRF). Unavailable revocation sources yield `indeterminate`, never `valid`.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/v1/engine/api.schema.json#/$defs/ValidateCertificateRequest'
      responses:
        '200':
          description: Validation result.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/engine/api.schema.json#/$defs/CertificateValidation'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/policies:
    get:
      tags: [metadata]
      operationId: listPolicies
      summary: List signature policies and their evidence level
      responses:
        '200':
          description: Policies.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/engine/api.schema.json#/$defs/PolicyList'
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /v1/capabilities:
    get:
      tags: [metadata]
      operationId: getCapabilities
      summary: Engine version, algorithms, policies and limits
      responses:
        '200':
          description: Capabilities.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/engine/api.schema.json#/$defs/Capabilities'
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /health/live:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness probe
      description: Unauthenticated, reachable only inside the private network. Reveals no configuration.
      security: []
      responses:
        '200':
          description: Process alive.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/engine/api.schema.json#/$defs/Liveness'
        '429': { $ref: '#/components/responses/RateLimited' }
  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness probe
      description: Unauthenticated, reachable only inside the private network.
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/engine/api.schema.json#/$defs/Readiness'
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/engine/api.schema.json#/$defs/Readiness'
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: Rotatable service credential (ENGINE_SERVICE_TOKEN), private network only.
    mutualTLS:
      type: mutualTLS
      description: Client certificate issued for the Hub.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Unique per logical operation; reuse with a different body returns IDEMPOTENCY_CONFLICT.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]+$'
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Propagated across services and logs.
      schema:
        $ref: '../schemas/v1/common.schema.json#/$defs/Uuid'
    PreparationId:
      name: preparation_id
      in: path
      required: true
      schema:
        $ref: '../schemas/v1/common.schema.json#/$defs/Uuid'
    ValidationId:
      name: validation_id
      in: path
      required: true
      schema:
        $ref: '../schemas/v1/common.schema.json#/$defs/Uuid'
  responses:
    Unauthenticated:
      description: UNAUTHENTICATED.
      content:
        application/json:
          schema: { $ref: '../schemas/v1/errors.schema.json#/$defs/HttpError' }
    NotFound:
      description: NOT_FOUND.
      content:
        application/json:
          schema: { $ref: '../schemas/v1/errors.schema.json#/$defs/HttpError' }
    Conflict:
      description: CONFLICT, IDEMPOTENCY_CONFLICT or CMS_RESERVATION_EXCEEDED.
      content:
        application/json:
          schema: { $ref: '../schemas/v1/errors.schema.json#/$defs/HttpError' }
    Gone:
      description: PREPARATION_EXPIRED.
      content:
        application/json:
          schema: { $ref: '../schemas/v1/errors.schema.json#/$defs/HttpError' }
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE.
      content:
        application/json:
          schema: { $ref: '../schemas/v1/errors.schema.json#/$defs/HttpError' }
    Unprocessable:
      description: VALIDATION_FAILED or a domain error (DOCUMENT_INVALID, DOCUMENT_HASH_MISMATCH, STORAGE_REF_INVALID, CERTIFICATE_INVALID, CERTIFICATE_MISMATCH, SIGNATURE_INVALID, UNSUPPORTED_ALGORITHM, UNSUPPORTED_POLICY).
      content:
        application/json:
          schema: { $ref: '../schemas/v1/errors.schema.json#/$defs/HttpError' }
    RateLimited:
      description: RATE_LIMITED.
      content:
        application/json:
          schema: { $ref: '../schemas/v1/errors.schema.json#/$defs/HttpError' }
    Unavailable:
      description: SERVICE_UNAVAILABLE.
      content:
        application/json:
          schema: { $ref: '../schemas/v1/errors.schema.json#/$defs/HttpError' }
