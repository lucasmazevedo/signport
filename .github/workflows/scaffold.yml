name: Scaffold checks
on: [push, pull_request]
# Least privilege; no secrets are used. Never switch to pull_request_target.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Required documentation
        run: |
          test -s SPEC.md
          test -s AGENTS.md
          test -s LICENSE
          test -s ROADMAP.md
          test -s docs/release-gates.md
          for d in apps/{hub,engine,desktop,extension} packages/{sdk-js,sdk-php,protocol} providers/birdid; do
            test -s "$d/AGENTS.md" || exit 1
          done
  protocol:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/protocol
    steps:
      # Actions pinned by full commit SHA (SPEC §20); update via Dependabot/Renovate with review.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      # pnpm version (12.4.2) comes from packageManager in packages/protocol/package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: packages/protocol/package.json
      - name: Toolchain versions
        run: |
          node --version
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: OpenAPI lint and contract tests
        run: pnpm run check
  engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Never pick up the runner's Python; use the uv-managed patch pinned in .python-version.
      UV_PYTHON_PREFERENCE: only-managed
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv pinned by version and by the SHA-256 of the official x86_64 Linux archive.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'
          checksum: 'bf65ac1a0af10f92c522d91ac096c7c0a39657647b155577e7836c2cbbb4526c'
          enable-cache: false
          working-directory: apps/engine
      - name: Python pinned by .python-version (managed by uv)
        run: uv python install
      - name: Toolchain versions
        run: |
          uv --version
          uv run --locked python --version
          openssl version
      - name: Reproducible environment from uv.lock
        run: uv sync --locked
      - name: Ruff
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Pyright (strict)
        run: uv run --locked pyright
      - name: Pytest (includes OpenSSL independent verification)
        env:
          SIGNPORT_REQUIRE_OPENSSL: '1'
        run: uv run --locked pytest
